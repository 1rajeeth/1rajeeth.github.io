const initial={wardrobe:seed.wardrobe.map((x,i)=>({...x,id:'w'+i,favorite:false})),outfits:[],grooming:seed.grooming.map((x,i)=>({...x,id:'g'+i})),events:[],watchlist:[],reading:[],tasks:[],gym:[],weight:[],careChecks:{},selectedOutfit:[],journal:[],pomodoro:{mode:'focus',remaining:1500,endsAt:0,sessions:0,running:false}};
let state;try{state={...initial,...JSON.parse(localStorage.getItem('everyday-personal-dashboard')||'{}')}}catch{state=initial}
let page='home', searchTerm='',filter='All',editMode=false;
const photoUrls={};
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('everyday-dashboard-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function photoPut(key,blob){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function photoGet(key){try{const db=await dbOpen();return await new Promise((resolve,reject)=>{const r=db.transaction('photos').objectStore('photos').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}catch{return null}}
async function photoDelete(key){try{const db=await dbOpen();db.transaction('photos','readwrite').objectStore('photos').delete(key)}catch{}}
async function hydratePhotos(){for(const item of state.wardrobe){if(!item.photoKey)continue;let url=photoUrls[item.photoKey];if(!url){const blob=await photoGet(item.photoKey);if(!blob)continue;url=photoUrls[item.photoKey]=URL.createObjectURL(blob)}for(const id of ['photo-'+item.id,'railphoto-'+item.id]){const img=document.getElementById(id);if(img){img.src=url;img.hidden=false}}for(const id of ['placeholder-'+item.id,'railplaceholder-'+item.id]){const ph=document.getElementById(id);if(ph)ph.hidden=true}}document.querySelectorAll('[data-photo-key]').forEach(img=>{const url=photoUrls[img.dataset.photoKey];if(url)img.src=url})}
const descriptions={home:'A calmer place to keep life in view.',wardrobe:'Your clothes, shoes, and laundry at a glance.',grooming:'Everyday care, grooming, and fragrance stock.',care:'A gentle nudge for the routines that keep things fresh.',events:'Plan what is coming up and send events to your calendar.',watchlist:'Pick up where you left off.',reading:'Keep your books and reading progress together.',tasks:'A simple list for what needs doing.',gym:'Track sessions, exercises, and working weights.',weight:'Log measurements and watch your trend.',outfits:'Style a look from your own wardrobe.',journal:'A quiet place to collect your days.',education:'Settle in, focus, and keep your studies moving.'};

state.grooming=(state.grooming||[]).filter(item=>String(item.Name||'').trim().length>0);state.wardrobe=(state.wardrobe||[]).map(item=>({...item,'Laundry Status':item['Laundry Status']==='In Wardrobe'||!item['Laundry Status']?'Clean':item['Laundry Status']}));save();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){if(!d)return 'No date';let x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function setPage(p){page=p;searchTerm='';filter='All';render()}
function toggleEditMode(){editMode=!editMode;render();toast(editMode?'Edit controls are on':'Edit controls are off')}
function render(){const active=document.activeElement,keepSearch=active?.classList?.contains('search'),caret=keepSearch?active.selectionStart:null,placeholder=keepSearch?active.placeholder:'';document.getElementById('pagetitle').textContent=navItems.find(n=>n[0]===page)?.[2]||'Overview';document.getElementById('pagesub').textContent=descriptions[page];document.getElementById('nav').innerHTML=navItems.map(n=>`<button class="${page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('');let view=document.getElementById('view');view.innerHTML=({home:homeView,wardrobe:wardrobeView,outfits:outfitsView,journal:journalView,grooming:groomingView,care:careView,events:eventsView,watchlist:watchView,reading:readingView,tasks:tasksView,gym:gymView,weight:weightView,education:educationView}[page])();view.classList.toggle('edit-mode',editMode);let toggle=document.getElementById('editToggle');toggle.textContent=editMode?'✎ Edit mode: on':'✎ Edit mode: off';toggle.classList.toggle('active',editMode);if(keepSearch){const next=[...view.querySelectorAll('.search')].find(x=>x.placeholder===placeholder)||view.querySelector('.search');if(next){next.focus();if(caret!==null)next.setSelectionRange(caret,caret)}}if(page==='wardrobe'||page==='outfits')hydratePhotos();if(page==='education')updatePomodoroUI();}
function countNote(label,num,note){return `<div class="card"><div class="statlabel">${label}</div><div class="statval">${num}</div><div class="statnote">${note}</div></div>`}
function homeView(){let laundry=state.wardrobe.filter(x=>x['Laundry Status']==='In Wash').length;let low=state.grooming.filter(x=>/low|out|empty/i.test(x['Stock Level'])).length;let next=state.events.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);let open=state.tasks.filter(x=>!x.done).length;let date=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});let ready=state.wardrobe.filter(x=>['Clean','To Put Away'].includes(x['Laundry Status']));return `<section class="home-hero"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><div class="hero-content"><div class="eyebrow">${date.toUpperCase()} · YOUR PERSONAL SPACE</div><h2>Make today feel a little more <em>you.</em></h2><p>Your routines, plans, and little wins in one place.</p><div class="hero-actions"><button class="btn primary" onclick="generateFromHome()">✦ Style me an outfit</button><button class="btn hero-glass" onclick="focusFromHome()">◷ Start a focus sprint</button><button class="btn hero-glass" onclick="openJournalForm()">✎ Write a thought</button></div></div><div class="hero-orb-main"><span>✧</span></div></section><div class="grid stats">${countNote('Clothing pieces',state.wardrobe.length,'in your visual closet')}${countNote('Grooming items',state.grooming.length,low?`${low} running low or out`:'your care shelf')}${countNote('Ready to wear',ready.length,'clean or ready to put away')}${countNote('Open tasks',open,'things still on your list')}</div><div class="grid two"><section class="card"><div class="cardhead"><h2>On your radar</h2><button class="smallbtn" onclick="setPage('events')">Calendar ↗</button></div>${next.length?`<div class="list">${next.map(e=>`<div class="listrow"><div><b>${esc(e.name)}</b><div class="muted">${fmtDate(e.date)} ${e.time?`· ${esc(e.time)}`:''}</div></div><span class="pill">${esc(e.kind||'Event')}</span></div>`).join('')}</div>`:`<div class="empty">Nothing on the calendar yet.</div>`}<button class="btn quick-cta" onclick="openForm('events')">＋ Add something to the calendar</button></section><section class="card"><div class="cardhead"><h2>Quick capture</h2><span class="pill green">Tap to add</span></div><div class="quick"><button onclick="openForm('tasks')"><b>＋ Task</b><span>Capture a to do</span></button><button onclick="openForm('events')"><b>＋ Event</b><span>Plan a date</span></button><button onclick="openForm('watchlist')"><b>＋ Show</b><span>Save a series</span></button><button onclick="openForm('reading')"><b>＋ Book</b><span>Add a read</span></button><button onclick="openForm('gym')"><b>＋ Workout</b><span>Log training</span></button><button onclick="openForm('weight')"><b>＋ Weigh in</b><span>Log weight</span></button><button onclick="openJournalForm()"><b>＋ Journal</b><span>Capture today</span></button><button onclick="setPage('education')"><b>＋ Study</b><span>Open focus room</span></button></div></section></div><div class="grid two" style="margin-top:16px"><section class="card"><div class="cardhead"><h2>Outfit of the moment</h2><button class="smallbtn" onclick="generateFromHome()">Surprise me ✦</button></div><div class="list">${ready.slice(0,3).map(x=>`<div class="listrow"><div><b>${esc(x.Name)}</b><div class="muted">${esc(x.Category)} · ${esc(x['Colour / Details'])}</div></div><span class="pill green">${esc(x['Laundry Status'])}</span></div>`).join('')||'<div class="muted">Mark a few pieces clean to get outfit ideas.</div>'}</div></section><section class="card"><div class="cardhead"><h2>Today’s focus</h2><button class="smallbtn" onclick="setPage('tasks')">Tasks ↗</button></div>${state.tasks.filter(x=>!x.done).slice(0,4).map(t=>`<label class="checkline"><input type="checkbox" onchange="toggleTask('${t.id}')"><span>${esc(t.name)}</span></label>`).join('')||'<div class="empty">No open tasks. Enjoy the breathing room.</div>'}</section></div><div class="home-footer"><span class="home-footer-star">✦</span><span>Small steps count. Your dashboard saves automatically in this browser.</span><button class="smallbtn" onclick="setPage('education')">Study space →</button></div>`}
function filtered(list,props){let q=searchTerm.toLowerCase();return list.filter(x=>(filter==='All'||props.some(p=>String(x[p]||'')===filter))&&(!q||Object.values(x).some(v=>String(v).toLowerCase().includes(q))))}
function toolbar(categories,add,placeholder='Search items'){return `<div class="toolbar"><input class="field search" placeholder="${placeholder}" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><select onchange="filter=this.value;render()">${['All',...categories].map(c=>`<option ${c===filter?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn primary" onclick="${add}">＋ Add</button></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nothing here yet.</td></tr>`}</tbody></table></div>`}
function wardrobeView(){let cats=[...new Set(state.wardrobe.map(x=>x.Category).filter(Boolean))].sort();let arr=filtered(state.wardrobe,['Category']);let cards=arr.map(x=>`<article class="garment ${state.selectedOutfit.includes(x.id)?'selected':''} fade-in"><div class="garment-photo"><img id="photo-${x.id}" alt="Photo of ${esc(x.Name)}" hidden><span class="photo-placeholder" id="placeholder-${x.id}">${garmentEmoji(x.Category)}</span><button class="favorite ${x.favorite?'on':''}" title="Favourite" onclick="toggleFavorite('${x.id}')">${x.favorite?'♥':'♡'}</button><button class="photo-btn" onclick="document.getElementById('upload-${x.id}').click()">${x.photoKey?'Change photo':'＋ Add photo'}</button>${x.photoKey?`<button class="photo-remove" onclick="removeClothingPhoto('${x.id}')">Remove photo</button>`:''}<input id="upload-${x.id}" type="file" accept="image/*" hidden onchange="uploadClothingPhoto('${x.id}',this)"></div><div class="garment-body"><div class="garment-title">${esc(x.Name)}</div><div class="garment-meta">${esc(x.Category)} · ${esc(x['Colour / Details'])}</div><div class="garment-actions"><select onchange="updateItem('wardrobe','${x.id}','Laundry Status',this.value)">${['Clean','Worn','In Wash','To Put Away'].map(st=>`<option ${x['Laundry Status']===st?'selected':''}>${st}</option>`).join('')}</select><button class="pick-btn ${state.selectedOutfit.includes(x.id)?'on':''}" onclick="toggleOutfitItem('${x.id}')">${state.selectedOutfit.includes(x.id)?'✓ Added':'＋ Outfit'}</button><button class="smallbtn edit-mode-only" onclick="openForm('wardrobe','${x.id}')">Edit</button></div></div></article>`).join('');return `<div class="sectionintro"><p>${state.wardrobe.length} pieces. <span class="pill green">Clean</span> ready · <span class="pill">Worn</span> currently worn · <span class="pill orange">In Wash</span> dirty / washing · <span class="pill">To Put Away</span> clean, not stored.</p></div>${toolbar(cats,"openForm('wardrobe')",'Search clothes, colour, category') function garmentEmoji(cat){let c=(cat||'').toLowerCase();return /shoe|footwear|trainers/.test(c)?'👟':/trouser|jean|short|bottom/.test(c)?'👖':/coat|jacket|hoodie|sweater|knit/.test(c)?'🧥':/bag/.test(c)?'👜':/accessor/.test(c)?'🧢':'👕'}
function toggleFavorite(id){let x=state.wardrobe.find(x=>x.id===id);if(x)x.favorite=!x.favorite;save();render()}
function toggleOutfitItem(id){let set=new Set(state.selectedOutfit);if(set.has(id))set.delete(id);else set.add(id);state.selectedOutfit=[...set];save();render()}
async function removeClothingPhoto(id){const item=state.wardrobe.find(x=>x.id===id);if(!item?.photoKey)return;if(!confirm('Remove this photo from the clothing item?'))return;await photoDelete(item.photoKey);if(photoUrls[item.photoKey]){URL.revokeObjectURL(photoUrls[item.photoKey]);delete photoUrls[item.photoKey]}item.photoKey='';save();toast('Clothing photo removed');render()}
async function uploadClothingPhoto(id,input){let file=input.files&&input.files[0];if(!file)return;try{let img=await new Promise((resolve,reject)=>{let i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);resolve(i)};i.onerror=reject;i.src=u});let scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.78));let key='clothing-'+id;await photoPut(key,blob);let item=state.wardrobe.find(x=>x.id===id);if(item)item.photoKey=key;save();render();toast('Photo added to your closet')}catch(e){alert('Could not save this photo. Try choosing a smaller image.')}input.value=''}
function outfitsView(){let selected=state.wardrobe.filter(x=>state.selectedOutfit.includes(x.id));let available=filtered(state.wardrobe,['Category']).filter(x=>!['In Wash','Worn'].includes(x['Laundry Status']));let pieces=selected.map(x=>`<div class="outfit-piece"><img id="railphoto-${x.id}" alt="" hidden><span class="outfit-thumb" id="railplaceholder-${x.id}">${garmentEmoji(x.Category)}</span><div><div class="outfit-name">${esc(x.Name)}</div><div class="outfit-sub">${esc(x.Category)}</div></div><button class="smallbtn" onclick="toggleOutfitItem('${x.id}')">×</button></div>`).join('');let opts=[...new Set(state.wardrobe.map(x=>x.Category).filter(Boolean))].sort();let list=available.map(x=>`<label class="checkline"><input type="checkbox" ${state.selectedOutfit.includes(x.id)?'checked':''} onchange="toggleOutfitItem('${x.id}')"><span style="flex:1"><b>${esc(x.Name)}</b><div class="muted">${esc(x.Category)} · ${esc(x['Laundry Status'])}</div></span></label>`).join('');let saved=state.outfits.map(o=>{let its=state.wardrobe.filter(x=>o.items.includes(x.id));return `<article class="saved-look"><h3>${esc(o.name)}</h3><div class="saved-thumbs">${its.slice(0,5).map(x=>x.photoKey?`<img data-photo-key="${esc(x.photoKey)}" alt="">`:`<span>${garmentEmoji(x.Category)}</span>`).join('')}</div><div class="muted" style="font-size:11px;margin-bottom:10px">${its.length} pieces${o.note?' · '+esc(o.note):''}</div><div class="look-actions"><button class="btn soft" onclick="loadOutfit('${o.id}')">Edit look</button><button class="btn" onclick="wearOutfit('${o.id}')">Wear this</button><button class="smallbtn" onclick="deleteOutfit('${o.id}')">×</button></div></article>`}).join('');return `<div class="sectionintro"><p>Choose pieces yourself or generate a complete look, head to toe. Suggestions use your item categories, colours, and occasion style.</p></div><section class="card generator-bar"><div><div class="eyebrow">STYLE ENGINE</div><h2>Build me a whole outfit</h2><p class="muted" style="margin:4px 0 0;font-size:12px">We’ll pick coordinated layers from clean pieces and explain the styling choices.</p></div><div class="generator-controls"><select id="outfitStyle"><option>Everyday</option><option>Streetwear</option><option>Smart casual</option><option>Cosy</option><option>Summer</option><option>Gym</option></select><button class="btn primary" onclick="generateOutfit()">✦ Generate outfit</button></div></section><div class="outfit-layout"><section class="card"><div class="cardhead"><div><h2>Choose your pieces</h2><span class="muted" style="font-size:12px">${state.selectedOutfit.length} selected</span></div><button class="smallbtn" onclick="clearOutfit()">Clear selection</button></div><div class="toolbar"><input class="field search" placeholder="Find a piece" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><select onchange="filter=this.value;render()"><option>All</option>${opts.map(c=>`<option ${filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div style="max-height:520px;overflow:auto;padding-right:5px">${list}</div></section><aside class="card outfit-rail"><div class="cardhead"><div><div class="eyebrow">THE LOOK</div><h2>Outfit in progress</h2></div><span class="pill green">${selected.length} pieces</span></div>${pieces?`<div class="outfit-items">${pieces}</div>`:'<div class="empty">Your canvas is waiting. Choose pieces to get started.</div>'}${outfitAdvice?`<div class="style-advice"><b>Why this works</b><p>${esc(outfitAdvice)}</p></div>`:''}<button class="btn primary" style="width:100%" onclick="saveOutfit()" ${selected.length?'':'disabled'}>✦ Save this outfit</button><button class="btn" style="width:100%;margin-top:8px" onclick="wearSelection()" ${selected.length?'':'disabled'}>Wear these pieces</button></aside></div><div class="card" style="margin-top:18px"><div class="cardhead"><h2>Saved outfits</h2><span class="pill">${state.outfits.length} looks</span></div>${saved?`<div class="saved-grid">${saved}</div>`:'<div class="heart-empty">Saved looks will live here, ready for a repeat.</div>'}</div>`}
let outfitAdvice='';
function outfitRole(item){let c=(item.Category+' '+item.Name).toLowerCase();if(/headwear|hat|beanie|cap|bucket hat/.test(c))return 'head';if(/shoe|sneaker|clog|slides|dress shoes/.test(c))return 'shoes';if(/socks/.test(c))return 'socks';if(/underwear|boxer|sleepwear|robe/.test(c))return 'base';if(/shorts|jeans|bottom|trouser|cargo|jogger|pants|jorts/.test(c))return 'bottom';if(/jacket|outerwear|blazer|hoodie|sweatshirt|knitwear|jumper|sweater/.test(c))return 'layer';if(/belt|watch|jewelry|accessor|chain|ring/.test(c))return 'accessory';if(/shirt|t-shirt|tee|polo|vest|tops/.test(c))return 'top';return 'accessory'}
function pickStyleItem(items,role,style,used){let candidates=items.filter(x=>outfitRole(x)===role&&!used.has(x.id));if(!candidates.length)return null;let rank=x=>{let text=(x.Name+' '+x.Category+' '+x['Colour / Details']).toLowerCase(),n=0;if(style==='Streetwear')n+=(/graphic|hoodie|cargo|wide-leg|sneaker|jorts/.test(text)?4:0);if(style==='Smart casual')n+=(/polo|dress|blazer|oxford|button|formal|trouser/.test(text)?5:0);if(style==='Cosy')n+=(/fleece|knit|thermal|jogger|sweater/.test(text)?5:0);if(style==='Summer')n+=(/short|linen|camp collar|slide|sandal/.test(text)?5:0);if(style==='Gym')n+=(/activewear|athletic|performance|adidas|under armour|gym/.test(text)?5:0);if(style==='Everyday')n+=(/plain|cotton|jeans|sneaker/.test(text)?2:0);if(x.favorite)n+=2;return n+Math.random()*1.8};return candidates.sort((a,b)=>rank(b)-rank(a)).slice(0,Math.min(4,candidates.length))[Math.floor(Math.random()*Math.min(4,candidates.length))]}
function colorWords(item){return ((item?.Name||'')+' '+(item?.['Colour / Details']||'')).toLowerCase()}
function generateOutfit(){let style=document.getElementById('outfitStyle')?.value||'Everyday';let ready=state.wardrobe.filter(x=>!['In Wash','Worn'].includes(x['Laundry Status']));if(!ready.length)ready=state.wardrobe.filter(x=>x['Laundry Status']!=='In Wash');let used=new Set(),look={};for(let role of ['head','top','layer','bottom','socks','shoes','accessory']){let item=pickStyleItem(ready,role,style,used);if(item){look[role]=item;used.add(item.id)}}let selected=Object.values(look);state.selectedOutfit=selected.map(x=>x.id);let top=look.top,bottom=look.bottom,layer=look.layer,shoes=look.shoes;let a=colorWords(top),b=colorWords(bottom);let palette=/black|charcoal|grey|gray/.test(a)?'The darker top gives the look a clean anchor; lighter denim or neutral shoes keep it balanced.':/white|cream|off-white|beige|tan/.test(a)?'The light top brightens the outfit; deeper trousers give it contrast.':/blue|navy/.test(a)?'The blue tones feel relaxed; grey, cream, or denim keep the palette easy.':/green|sage|olive/.test(a)?'The muted green works well with denim and warm neutral accessories.':'Keep the remaining colours calm so the main piece stands out.';let slots=['Headwear','Top','Layer','Bottoms','Socks','Shoes','Accessories'];let roleLabels={head:'headwear',top:'top',layer:'layer',bottom:'bottoms',socks:'socks',shoes:'shoes',accessory:'accessories'};let missing=[];for(let r of ['head','top','layer','bottom','socks','shoes','accessory'])if(!look[r])missing.push(roleLabels[r]);let choice=selected.map(x=>x.Category).join(', ');let vibe=style==='Smart casual'?'For a sharper finish, keep the shirt tucked and let the blazer sit open.':style==='Streetwear'?'Let the graphic or silhouette lead; keep the accessories understated.':style==='Cosy'?'Layer the knit or fleece over the base and keep the proportions relaxed.':style==='Summer'?'Keep the layers light and let the shorts or shirt carry the colour.':style==='Gym'?'This athletic combination keeps movement easy; choose performance socks with the trainers.':'This is an easy everyday mix; a small accessory adds a finishing detail.';outfitAdvice=`${style} look. ${palette} ${vibe}${missing.length?` Your closet doesn’t currently have a ${missing.join(', ')} item ready for this look.`:''}${top&&bottom?` Palette: ${top.Category} with ${bottom.Category}${layer?` and ${layer.Category}`:''}${shoes?`, finished with ${shoes.Category}`:''}.`:''}`;page='outfits';searchTerm='';filter='All';save();render();toast('A new head-to-toe look is ready')}
function generateFromHome(){setPage('outfits');generateOutfit()}
function clearOutfit(){state.selectedOutfit=[];searchTerm='';filter='All';save();render()}
function saveOutfit(){if(!state.selectedOutfit.length)return;let name=prompt('Give this outfit a name','Everyday look');if(name===null)return;name=name.trim()||'Untitled outfit';state.outfits.unshift({id:'o'+Date.now(),name,items:[...state.selectedOutfit],note:outfitAdvice||''});save();toast('Outfit saved');render()}
function loadOutfit(id){let o=state.outfits.find(x=>x.id===id);if(o){state.selectedOutfit=[...o.items];page='outfits';searchTerm='';filter='All';save();render();window.scrollTo({top:0,behavior:'smooth'})}}
function deleteOutfit(id){state.outfits=state.outfits.filter(x=>x.id!==id);save();render()}
function wearSelection(){let ids=new Set(state.selectedOutfit);state.wardrobe.forEach(x=>{if(ids.has(x.id))x['Laundry Status']='Worn'});save();toast('Marked as worn');render()}
function wearOutfit(id){let o=state.outfits.find(x=>x.id===id);if(!o)return;let ids=new Set(o.items);state.wardrobe.forEach(x=>{if(ids.has(x.id))x['Laundry Status']='Worn'});save();toast('Outfit marked as worn');render()}
function toast(text){let el=document.getElementById('toast');if(!el)return;el.textContent=text;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function journalView(){let entries=[...state.journal].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||''));let q=searchTerm.toLowerCase();entries=entries.filter(e=>!q||[e.title,e.body,e.mood,e.tags].join(' ').toLowerCase().includes(q));let count=state.journal.length;let today=new Date().toISOString().slice(0,10);let thisMonth=state.journal.filter(e=>(e.date||'').slice(0,7)===today.slice(0,7)).length;let words=state.journal.reduce((n,e)=>n+(e.body||'').trim().split(/\s+/).filter(Boolean).length,0);let moods=[...new Set(state.journal.map(e=>e.mood).filter(Boolean))];return `<div class="sectionintro"><p>A private space to notice what happened, what mattered, and how you’re feeling. Your entries stay in this browser unless you export a backup.</p></div><div class="journal-tools"><input class="field search" placeholder="Search your journal" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="btn primary" onclick="openJournalForm()">✎ New entry</button></div><div class="journal-grid"><section class="journal-list">${entries.length?entries.map(e=>`<article class="journal-entry"><div class="journal-entry-head"><div><div class="journal-date">${fmtDate(e.date)}${e.mood?` · ${esc(e.mood)}`:''}</div><h2 class="journal-title">${esc(e.title||'A note to myself')}</h2></div><span class="journal-mood">${moodEmoji(e.mood)}</span></div><div class="journal-body">${esc(e.body||'')}</div><div class="journal-entry-head"><div class="journal-tags">${(e.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div><button class="smallbtn" title="Edit entry" onclick="openJournalForm('${e.id}')">Edit</button><button class="smallbtn" title="Delete entry" onclick="deleteJournal('${e.id}')">×</button></div></div></article>`).join(''):'<div class="card empty">No entries yet. Start with a small moment from today.</div>'}</section><aside class="card journal-side"><div class="eyebrow">YOUR JOURNAL</div><h2 style="margin:4px 0 12px">A little reflection</h2><div class="journal-stat"><span>Entries</span><b>${count}</b></div><div class="journal-stat"><span>This month</span><b>${thisMonth}</b></div><div class="journal-stat"><span>Words gathered</span><b>${words.toLocaleString()}</b></div><h3 style="margin-top:18px">Need a starting point?</h3><div class="journal-prompts"><button onclick="useJournalPrompt('What felt good today?')">What felt good today?</button><button onclick="useJournalPrompt('What is taking up space in my mind?')">What is taking up space in my mind?</button><button onclick="useJournalPrompt('What do I want to remember about this week?')">What do I want to remember about this week?</button><button onclick="useJournalPrompt('What would make tomorrow feel easier?')">What would make tomorrow feel easier?</button></div>${moods.length?`<div style="margin-top:18px"><div class="muted" style="font-size:11px;margin-bottom:7px">MOODS YOU’VE LOGGED</div><div class="journal-tags">${moods.map(m=>`<span class="pill">${moodEmoji(m)} ${esc(m)}</span>`).join('')}</div></div>`:''}</aside></div>`}
function moodEmoji(m){return ({'Great':'☀️','Good':'🌿','Okay':'☁️','Low':'🌧️','Anxious':'🫧','Grateful':'💛','Tired':'🌙','Inspired':'✨'}[m]||'📖')}
function openJournalForm(id,promptText=''){let entry=id?state.journal.find(x=>x.id===id):null;let val=(k,d='')=>esc(entry?.[k]??d);let today=new Date().toISOString().slice(0,10);document.getElementById('modalroot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><form class="modalbox journal-modal" onsubmit="saveJournalEntry(event,'${entry?.id||''}')"><div class="modalhead"><div><div class="eyebrow">A MOMENT FOR YOU</div><h2 style="margin:3px 0 0">${entry?'Edit entry':'New journal entry'}</h2></div><button type="button" class="smallbtn" onclick="closeForm()">✕</button></div><div class="formgrid"><label class="formfield"><span>Date</span><input name="date" type="date" value="${val('date',today)}" required></label><label class="formfield"><span>Mood</span><select name="mood">${['','Great','Good','Okay','Low','Anxious','Grateful','Tired','Inspired'].map(m=>`<option value="${esc(m)}" ${val('mood')===m?'selected':''}>${m?moodEmoji(m)+' '+m:'Choose a mood'}</option>`).join('')}</select></label><label class="formfield full"><span>Title</span><input name="title" type="text" placeholder="A small title for this moment" value="${val('title')}"></label><label class="formfield full"><span>Your entry</span><textarea id="journalBody" name="body" placeholder="Write freely. This space is yours…" required>${val('body',promptText)}</textarea></label><div class="wordcount formfield full" id="journalWordCount">0 words</div><label class="formfield full"><span>Tags <span class="muted">· separate with commas</span></span><input name="tags" type="text" placeholder="work, weekend, ideas" value="${val('tags')}"></label></div><div class="modalactions"><button type="button" class="btn" onclick="closeForm()">Cancel</button><button class="btn primary">${entry?'Save changes':'Save entry'}</button></div></form></div>`;let body=document.getElementById('journalBody'),counter=document.getElementById('journalWordCount');const update=()=>{counter.textContent=(body.value.trim()?body.value.trim().split(/\s+/).length:0)+' words'};body.addEventListener('input',update);update()}
function saveJournalEntry(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(id){let old=state.journal.find(x=>x.id===id);if(old)Object.assign(old,d)}else state.journal.unshift({id:'j'+Date.now(),created:new Date().toISOString(),...d});save();closeForm();toast(id?'Entry updated':'Entry saved');render()}
function deleteJournal(id){if(!confirm('Delete this journal entry?'))return;state.journal=state.journal.filter(x=>x.id!==id);save();render()}
function useJournalPrompt(text){openJournalForm('',text)}
function groomingView(){let cats=[...new Set(state.grooming.map(x=>x.Category).filter(Boolean))].sort();let arr=filtered(state.grooming,['Category']);let rows=arr.map(x=>`<tr><td class="rowname">${esc(x.Name)}</td><td>${esc(x.Category)}</td><td>${esc(x.Brand)}</td><td>${esc(x.Routine)||'<span class="muted">—</span>'}</td><td><select onchange="updateItem('grooming','${x.id}','Stock Level',this.value)">${['In stock','Running low','Out',''].map(s=>`<option value="${s}" ${(x['Stock Level']||'')===s?'selected':''}>${s||'Not set'}</option>`).join('')}</select></td><td><button class="smallbtn edit-mode-only" onclick="openForm('grooming','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('grooming','${x.id}')">×</button></td></tr>`).join('');return `<div class="sectionintro"><p>${state.grooming.length} items imported. Stock levels were blank in the source sheet; set them as you check your supplies.</p></div>${toolbar(cats,"openForm('grooming')",'Search products or brands')} ${table(['Item','Category','Brand','Routine / use','Stock level',''],rows)}`}
function careView(){let routine=[['Morning','Cleanse: Simple Purifying Gel Wash','Moisturise: Cien, Nivea, or Bulldog'],['Evening','First cleanse: Garnier Micellar Water','Second cleanse: Simple Purifying Gel Wash','Tone / exfoliate: Medicube Zero Pore Pads','Moisturise: Cien, Nivea, or Bulldog']];let items=['Fitted sheet — white · every 2–3 weeks','Duvet cover and pillowcases — green · every 2–3 weeks','Bath towels — taupe / pink / beige · weekly','Gym towel — beige · after each use','Face towels — 3 purple items · every 3 days'];return `<div class="grid two"><section class="card"><div class="cardhead"><h2>Skincare routine</h2><span class="pill green">From your tracker</span></div>${routine.map(r=>`<div class="routine"><strong>${r[0]}</strong><div>${r.slice(1).map(v=>`<div>${esc(v)}</div>`).join('')}</div></div>`).join('')}</section><section class="card"><div class="cardhead"><h2>Bedding & towels</h2><span class="pill">Care cadence</span></div>${items.map((v,i)=>`<label class="checkline ${state.careChecks[i]?'done':''}"><input type="checkbox" ${state.careChecks[i]?'checked':''} onchange="state.careChecks[${i}]=this.checked;save();render()"><span>${esc(v)}</span></label>`).join('')}<p class="muted" style="font-size:12px;margin-top:12px">These checkboxes are a quick “done” note; tick again to reset.</p></section></div>`}
function educationView(){let t=state.pomodoro;let modes=[['focus','Focus · 25'],['short','Short break · 5'],['long','Long break · 15']];let q=t.mode==='focus'?1500:t.mode==='short'?300:900;let secs=t.running?Math.max(0,Math.ceil((t.endsAt-Date.now())/1000)):t.remaining;let pct=Math.max(0,Math.min(100,(1-secs/q)*100));return `<div class="education-hero"><div><div class="eyebrow">YOUR STUDY SPACE</div><h2>One focused session at a time.</h2><p>Pick one small goal, work with the timer, then take a real break.</p></div><div class="education-spark">✦</div></div><div class="education-grid"><section class="card pomodoro-card"><div class="cardhead"><div><div class="eyebrow">POMODORO TIMER</div><h2>Focus room</h2></div><span class="pill green">${t.sessions} focus rounds</span></div><div class="timer-modes">${modes.map(([m,label])=>`<button class="timer-mode ${t.mode===m?'selected':''}" onclick="setPomodoroMode('${m}')">${label}</button>`).join('')}</div><div class="timer-ring" id="timerRing" style="--timer-pct:${pct}%"><div class="timer-center"><div class="timer-time" id="timerCount">${timerFormat(secs)}</div><div class="timer-label" id="timerModeLabel">${t.mode==='focus'?'FOCUS TIME':t.mode==='short'?'SHORT BREAK':'LONG BREAK'}</div></div></div><div class="timer-actions"><button class="btn primary" id="timerToggle" onclick="togglePomodoro()">${t.running?'Pause':'Start focus'}</button><button class="btn" onclick="resetPomodoro()">Reset</button></div><p class="timer-hint">${t.mode==='focus'?'Silence distractions. You only need to focus until the bell.':'Step away from your screen and let your mind reset.'}</p></section><section class="card blackboard-card"><div class="blackboard-mark">B</div><div class="eyebrow">COURSE HUB</div><h2>Blackboard Learn</h2><p class="muted">Open your University of Reading modules, course materials, announcements, and submissions.</p><a class="btn primary blackboard-link" href="https://www.bb.reading.ac.uk/ultra/institution-page" target="_blank" rel="noopener noreferrer">Open Blackboard <span>↗</span></a><div class="blackboard-foot">University of Reading · Learn Ultra</div></section></div><section class="card study-tips"><div class="cardhead"><h2>Your focus ritual</h2><span class="pill">A small reset</span></div><div class="focus-steps"><div><b>01</b><span>Choose one assignment or reading task.</span></div><div><b>02</b><span>Work until the focus timer ends.</span></div><div><b>03</b><span>Take a short break, then repeat.</span></div><div><b>04</b><span>After four rounds, take a longer pause.</span></div></div></section>`}
function timerFormat(n){n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function pomodoroTick(){let t=state.pomodoro;if(!t)return;if(t.running){let remaining=Math.max(0,Math.ceil((t.endsAt-Date.now())/1000));t.remaining=remaining;if(remaining===0){t.running=false;t.endsAt=0;if(t.mode==='focus'){t.sessions=(t.sessions||0)+1;t.mode=t.sessions%4===0?'long':'short'}else t.mode='focus';t.remaining=t.mode==='focus'?1500:t.mode==='short'?300:900;save();toast('Focus round complete — take a breath');if(page==='education')render()}else updatePomodoroUI()}}
function updatePomodoroUI(){let t=state.pomodoro;if(!t)return;let n=t.running?Math.max(0,Math.ceil((t.endsAt-Date.now())/1000)):t.remaining;let total=t.mode==='focus'?1500:t.mode==='short'?300:900;let count=document.getElementById('timerCount'),ring=document.getElementById('timerRing'),mode=document.getElementById('timerModeLabel'),toggle=document.getElementById('timerToggle');if(count)count.textContent=timerFormat(n);if(mode)mode.textContent=t.mode==='focus'?'FOCUS TIME':t.mode==='short'?'SHORT BREAK':'LONG BREAK';if(toggle)toggle.textContent=t.running?'Pause':'Start focus';if(ring)ring.style.setProperty('--timer-pct',`${Math.max(0,Math.min(100,(1-n/total)*100))}%`)}
function setPomodoroMode(mode){let t=state.pomodoro;t.mode=mode;t.running=false;t.endsAt=0;t.remaining=mode==='focus'?1500:mode==='short'?300:900;save();render()}
function focusFromHome(){setPage('education');if(state.pomodoro.mode!=='focus'){setPomodoroMode('focus')}if(!state.pomodoro.running)togglePomodoro()}
function togglePomodoro(){let t=state.pomodoro;if(t.running){t.remaining=Math.max(0,Math.ceil((t.endsAt-Date.now())/1000));t.running=false;t.endsAt=0}else{t.endsAt=Date.now()+t.remaining*1000;t.running=true}save();updatePomodoroUI()}
function resetPomodoro(){let t=state.pomodoro;t.running=false;t.endsAt=0;t.remaining=t.mode==='focus'?1500:t.mode==='short'?300:900;save();updatePomodoroUI()}
function eventsView(){let arr=state.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));let rows=arr.filter(x=>!searchTerm||JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())).map(x=>`<tr><td class="rowname">${esc(x.name)}</td><td>${fmtDate(x.date)}</td><td>${esc(x.time||'—')}</td><td>${esc(x.kind||'Event')}</td><td>${esc(x.location||'—')}</td><td><button class="smallbtn edit-mode-only" onclick="openForm('events','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('events','${x.id}')">×</button></td></tr>`).join('');return `<div class="sectionintro"><p>Add dates here, then export an .ics calendar file to import into Apple Calendar or Google Calendar. This standalone page cannot sync calendars in the background.</p></div><div class="toolbar"><input class="field search" placeholder="Search events" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="btn primary" onclick="openForm('events')">＋ Add event</button><button class="btn" onclick="exportCalendar()">Export .ics</button></div>${table(['Event','Date','Time','Type','Location / notes',''],rows)}`}
function watchView(){let arr=filtered(state.watchlist,['status']);let rows=arr.map(x=>`<tr><td class="rowname">${esc(x.name)}</td><td><select onchange="updateItem('watchlist','${x.id}','status',this.value)">${['Up next','Watching','Paused','Finished'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="itemcontrols"><span>S</span><input type="number" min="1" value="${x.season||1}" onchange="updateItem('watchlist','${x.id}','season',this.value)"><span>E</span><input type="number" min="0" value="${x.episode||0}" onchange="updateItem('watchlist','${x.id}','episode',this.value)"></div></td><td>${esc(x.service||'—')}</td><td>${esc(x.notes||'')}</td><td><button class="smallbtn edit-mode-only" onclick="openForm('watchlist','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('watchlist','${x.id}')">×</button></td></tr>`).join('');return `${toolbar(['Up next','Watching','Paused','Finished'],"openForm('watchlist')",'Search your shows')}${table(['Show','Status','Season / episode','Service','Notes',''],rows)}`}
function readingView(){let arr=filtered(state.reading,['status']);let rows=arr.map(x=>{let pct=x.total?Math.min(100,Math.round(100*(x.current||0)/x.total)):0;return `<tr><td class="rowname">${esc(x.name)}<div class="muted">${esc(x.author||'')}</div><div class="progress"><i style="width:${pct}%"></i></div></td><td><select onchange="updateItem('reading','${x.id}','status',this.value)">${['Want to read','Reading','Paused','Finished'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="itemcontrols"><input type="number" min="0" value="${x.current||0}" onchange="updateItem('reading','${x.id}','current',this.value)"><span>/</span><input type="number" min="0" value="${x.total||0}" onchange="updateItem('reading','${x.id}','total',this.value)"></div></td><td>${pct}%</td><td>${esc(x.notes||'')}</td><td><button class="smallbtn edit-mode-only" onclick="openForm('reading','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('reading','${x.id}')">×</button></td></tr>`}).join('');return `${toolbar(['Want to read','Reading','Paused','Finished'],"openForm('reading')",'Search books or authors')}${table(['Book / author','Status','Current / total pages','Progress','Notes',''],rows)}`}
function tasksView(){let arr=state.tasks.filter(x=>!searchTerm||JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>(a.due||'').localeCompare(b.due||''));return `<div class="sectionintro"><p>This list is stored on this device. It does not sync with Apple Reminders. For reminders and Siri capture, continue using the Reminders app.</p></div><div class="toolbar"><input class="field search" placeholder="Search tasks" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><button class="btn primary" onclick="openForm('tasks')">＋ Add task</button></div><section class="card">${arr.length?arr.map(x=>`<label class="checkline ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><span style="flex:1"><b>${esc(x.name)}</b>${x.due?` <span class="pill">${fmtDate(x.due)}</span>`:''}<div class="muted">${esc(x.notes||'')}</div></span><button class="smallbtn edit-mode-only" onclick="event.preventDefault();openForm('tasks','${x.id}')">Edit</button><button class="smallbtn" onclick="event.preventDefault();removeItem('tasks','${x.id}')">×</button></label>`).join(''):'<div class="empty">Your list is clear. Add a task whenever something comes up.</div>'}</section>`}
function gymView(){let arr=state.gym.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));let rows=arr.map(x=>`<tr><td>${fmtDate(x.date)}</td><td class="rowname">${esc(x.exercise||x.session)}</td><td>${esc(x.session||'—')}</td><td>${esc(x.sets||'—')}</td><td>${esc(x.reps||'—')}</td><td>${esc(x.load||'—')} kg</td><td>${esc(x.notes||'')}</td><td><button class="smallbtn edit-mode-only" onclick="openForm('gym','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('gym','${x.id}')">×</button></td></tr>`).join('');return `<div class="sectionintro"><p>Log one row per exercise. Use the notes for set-by-set details if your loads vary within a session.</p></div>${toolbar([],"openForm('gym')",'Search exercises and notes')}${table(['Date','Exercise','Session','Sets','Reps','Load','Notes',''],rows)}`}
function weightView(){let arr=state.weight.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));let vals=arr.map(x=>Number(x.value)).filter(Number.isFinite);let min=vals.length?Math.min(...vals):0,max=vals.length?Math.max(...vals):0;let points=arr.map((x,i)=>{let y=max===min?50:85-(Number(x.value)-min)/(max-min)*65;return `${arr.length<2?50:10+i*(80/(arr.length-1))},${y}`}).join(' ');let rows=arr.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td class="rowname">${esc(x.value)} kg</td><td>${esc(x.note||'')}</td><td><button class="smallbtn edit-mode-only" onclick="openForm('weight','${x.id}')">Edit</button><button class="smallbtn" onclick="removeItem('weight','${x.id}')">×</button></td></tr>`).join('');return `<div class="toolbar"><button class="btn primary" onclick="openForm('weight')">＋ Add weigh-in</button></div><div class="grid trackergrid"><section class="card"><div class="cardhead"><h2>Weight trend</h2><span class="pill">kg</span></div>${arr.length?`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:180px;overflow:visible"><line x1="5" y1="90" x2="95" y2="90" stroke="#2a3d53"/><polyline fill="none" stroke="#65eed6" stroke-width="1.7" points="${points}"/>${arr.map((x,i)=>{let y=max===min?50:85-(Number(x.value)-min)/(max-min)*65;let xx=arr.length<2?50:10+i*(80/(arr.length-1));return `<circle cx="${xx}" cy="${y}" r="2.3" fill="#a47dff"><title>${fmtDate(x.date)}: ${x.value} kg</title></circle>`}).join('')}</svg><div class="muted">${vals.length?`Latest: ${vals[vals.length-1]} kg · Range: ${min}–${max} kg`:''}</div>`:'<div class="empty">Add a weigh-in to start your trend.</div>'}</section><section class="card"><h2 style="margin-bottom:12px">Entries</h2>${table(['Date','Weight','Notes',''],rows)}</section></div>`}
function updateItem(type,id,key,value){let x=state[type].find(x=>x.id===id);if(x){x[key]=(['episode','season','current','total','load','sets','reps'].includes(key)?(value===''?'':Number(value)):value);save();render()}}
function removeItem(type,id){if(!confirm('Remove this item from your dashboard?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render()}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
const configs={wardrobe:{title:'Add a clothing item',fields:[['name','Item name','text','required'],['category','Category','text'],['colour','Colour / details','text'],['wash','Wash group','text'],['status','Laundry status','select','',['Clean','Worn','In Wash','To Put Away']] ]},grooming:{title:'Add a grooming item',fields:[['name','Item name','text','required'],['category','Category','text'],['brand','Brand','text'],['routine','Routine / use','text'],['stock','Stock level','select','',['','In stock','Running low','Out']]]},events:{title:'Add an event',fields:[['name','Event name','text','required'],['date','Date','date','required'],['time','Start time','time'],['kind','Type','text'],['location','Location / notes','text']]},watchlist:{title:'Add a show',fields:[['name','Show title','text','required'],['status','Status','select','',['Up next','Watching','Paused','Finished']],['season','Season','number'],['episode','Episode','number'],['service','Streaming service','text'],['notes','Notes','text']]},reading:{title:'Add a book',fields:[['name','Book title','text','required'],['author','Author','text'],['status','Status','select','',['Want to read','Reading','Paused','Finished']],['current','Current page','number'],['total','Total pages','number'],['notes','Notes','text']]},tasks:{title:'Add a task',fields:[['name','Task','text','required'],['due','Due date','date'],['notes','Notes','text']]},gym:{title:'Log a workout exercise',fields:[['date','Date','date'],['exercise','Exercise','text','required'],['session','Session','text'],['sets','Sets','text'],['reps','Reps','text'],['load','Load (kg)','number'],['notes','Set details / notes','textarea']]},weight:{title:'Log body weight',fields:[['date','Date','date','required'],['value','Weight (kg)','number','required'],['note','Notes','text']]}};
function openForm(type,id=''){let c=configs[type];if(!c)return;let item=id?state[type].find(x=>x.id===id):null;let values={};if(item){if(type==='wardrobe')values={name:item.Name,category:item.Category,colour:item['Colour / Details'],wash:item['Wash Category'],status:item['Laundry Status']};else if(type==='grooming')values={name:item.Name,category:item.Category,brand:item.Brand,routine:item.Routine,stock:item['Stock Level']};else values={...item}}let fields=c.fields.map(([key,label,t,req,opts])=>{let value=values[key]??'';return `<label class="formfield ${t==='textarea'?'full':''}"><span>${label}</span>${t==='select'?`<select name="${key}">${opts.map(o=>`<option value="${esc(o)}" ${String(value)===String(o)?'selected':''}>${esc(o)||'Not set'}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${key}" rows="3">${esc(value)}</textarea>`:`<input name="${key}" type="${t}" value="${esc(value)}" ${req==='required'?'required':''} ${t==='number'?'step="any"':''}>`}</label>`}).join('');document.getElementById('modalroot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><form class="modalbox" onsubmit="submitForm(event,'${type}')"><input type="hidden" name="editId" value="${esc(id)}"><div class="modalhead"><h2 style="margin:0">${item?'Edit':'Add'} ${c.title.replace(/^Add /,'')}</h2><button type="button" class="smallbtn" onclick="closeForm()">✕</button></div><div class="formgrid">${fields}</div><div class="modalactions"><button type="button" class="btn" onclick="closeForm()">Cancel</button><button class="btn primary">${item?'Save changes':'Save'}</button></div></form></div>`}
function closeForm(){document.getElementById('modalroot').innerHTML=''}
function submitForm(e,type){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries()),editId=data.editId;delete data.editId;let old=editId?state[type].find(x=>x.id===editId):null;let o={id:editId||type+Date.now(),...data};if(type==='wardrobe')o={...old,id:o.id,Name:o.name,Category:o.category,'Colour / Details':o.colour,'Wash Category':o.wash,'Laundry Status':o.status||'Clean',favorite:old?.favorite||false,photoKey:old?.photoKey};if(type==='grooming')o={...old,id:o.id,Name:o.name,Category:o.category,Brand:o.brand,Routine:o.routine,'Stock Level':o.stock};if(type==='tasks')o.done=old?.done??false;for(const k of ['episode','season','current','total','load','value'])if(o[k]!==undefined&&o[k]!=='')o[k]=Number(o[k]);if(type==='watchlist'){o.season=Number(o.season)||1;o.episode=Number(o.episode)||0}if(type==='reading'){o.current=Number(o.current)||0;o.total=Number(o.total)||0}if(type==='weight')o.value=Number(o.value);if(editId){let i=state[type].findIndex(x=>x.id===editId);if(i>=0)state[type][i]=o}else state[type].push(o);save();closeForm();toast(editId?'Entry updated':'Entry added');render()}
async function exportBackup(){let backup={...state,photos:{}};for(const item of state.wardrobe){if(!item.photoKey)continue;const blob=await photoGet(item.photoKey);if(blob)backup.photos[item.photoKey]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}let b=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});download(b,'everyday-dashboard-backup.json')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(!d.wardrobe||!d.grooming)throw 0;const photos=d.photos||{};delete d.photos;state={...initial,...d};for(const [key,url] of Object.entries(photos)){const blob=await (await fetch(url)).blob();await photoPut(key,blob)}save();render();alert('Backup imported.')}catch{alert('That file is not a valid dashboard backup.')}};r.readAsText(f);e.target.value=''}
function download(b,name){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n')}
function exportCalendar(){if(!state.events.length){alert('Add an event first.');return}let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Everyday Personal Dashboard//EN'];for(let e of state.events){if(!e.date)continue;let date=e.date.replaceAll('-','');let time=(e.time||'09:00').replace(':','')+'00';lines.push('BEGIN:VEVENT',`UID:${e.id}@everyday-dashboard`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART:${date}T${time}`,`SUMMARY:${icsEscape(e.name)}`,`DESCRIPTION:${icsEscape([e.kind,e.location].filter(Boolean).join(' · '))}`,'END:VEVENT')}lines.push('END:VCALENDAR');download(new Blob([lines.join('\r\n')],{type:'text/calendar'}),'everyday-events.ics')}
render();
setInterval(pomodoroTick,1000);
</script></body></html>
